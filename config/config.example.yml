# Curatarr Configuration
# Core settings for Plex recommendations

# Plex Server Connection
plex:
  url: http://YOUR_PLEX_URL:32400  # Or https://YOUR-SERVER.plex.direct:32400
  token: YOUR_PLEX_TOKEN  # Get from: https://support.plex.tv/articles/204059436
  movie_library: Movies
  tv_library: TV Shows

# TMDB API (required for metadata)
tmdb:
  api_key: YOUR_TMDB_API_KEY  # Get free key from: https://www.themoviedb.org/settings/api

# Users and Preferences
users:
  list: user1, user2, kids  # Plex usernames (comma-separated)
  preferences:
    user1:
      display_name: User One
      exclude_genres:  # Optional: genres to exclude
        - horror
      streaming_services:  # Optional: for external recommendations
        - netflix
        - disney_plus
    user2:
      display_name: User Two
      max_rating: PG-13  # Filter out R and NC-17 movies
    kids:
      display_name: Kids
      exclude_genres:
        - horror
        - thriller
      max_rating: PG  # Only G and PG content
      # Content ratings: Movies (G < PG < PG-13 < R < NC-17)
      #                  TV (TV-Y < TV-Y7 < TV-G < TV-PG < TV-14 < TV-MA)

# Household streaming services (for external watchlist categorization)
# Supported examples: netflix, disney_plus, hulu, amazon_prime, max, apple_tv_plus, paramount_plus, peacock
streaming_services: []

# General Settings
general:
  plex_only: true  # Only recommend from Plex library
  limit_plex_results: null  # Optional global override for collection size (null = 50 movies / 20 TV)
  confirm_operations: false  # Ask before labeling/collection updates
  randomize_recommendations: true
  normalize_counters: true
  show_summary: false
  show_genres: true
  show_cast: false
  show_director: false
  show_language: false
  show_rating: false
  show_imdb_link: false
  exclude_genre: ""  # Comma-separated global exclusions, e.g. "horror, documentary"
  log_retention_days: 7
  auto_update: true

# Recommendation quality filters (applies to internal Plex recommendations)
quality_filters:
  min_rating: 0.0
  min_vote_count: 0

# Collection behavior
collections:
  add_label: true
  label_name: Recommended
  append_usernames: true
  private_collections: true
  stale_removal_days: 7
  # Optional custom titles. ${user} is always replaced with display_name/username.
  # If omitted, Curatarr uses default titles.
  movie_collection_title: null  # Example: "Movie recommendations for ${user}"
  tv_collection_title: null     # Example: "TV picks for ${user}"

# External recommendations (content not in Plex)
external_recommendations:
  enabled: true
  movie_limit: 50
  show_limit: 20
  min_relevance_score: 0.65
  auto_open_html: false
  min_votes: 50
  max_iterations: 5
  language: null  # ISO-639-1 code like "en", or null for any

# Huntarr: Find missing/upcoming movies from collections
huntarr:
  sequel_huntarr: true    # Missing movies from collections you've started
  horizon_huntarr: true   # Upcoming unreleased movies from collections you own

# Optional: Logging level
logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR

# =============================================================================
# OPTIONAL MODULE FILES (in this directory)
# =============================================================================
# For advanced configuration, create these optional files alongside config.yml:
#
#   tuning.yml    - Weights and scoring behavior only
#   trakt.yml     - Trakt.tv integration (sync lists, import watchlist)
#   radarr.yml    - Radarr integration (auto-add movies)
#   sonarr.yml    - Sonarr integration (auto-add shows)
#
# Copy from *.example.yml files and customize as needed.
# =============================================================================
