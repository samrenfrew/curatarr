# Curatarr Tuning Configuration
# Scoring-only settings (weights and profile weighting behavior)
# This file is optional - defaults are used if not present.

# =============================================================================
# SCORING WEIGHTS
# =============================================================================
# Must sum to 1.0 for each media type.
movies:
  weights:
    genre: 0.25
    director: 0.05
    actor: 0.20
    keyword: 0.50  # TMDB keywords (themes/settings)

tv:
  weights:
    genre: 0.25
    studio: 0.10  # TV uses studio instead of director
    actor: 0.20
    keyword: 0.45

# =============================================================================
# RECENCY DECAY
# =============================================================================
# How much recent watches influence your profile.
recency_decay:
  enabled: true
  days_0_30: 1.0
  days_31_90: 0.75
  days_91_180: 0.50
  days_181_365: 0.25
  days_365_plus: 0.10

# =============================================================================
# RATING MULTIPLIERS
# =============================================================================
# How much user ratings influence the profile (5-star scale).
rating_multipliers:
  star_5: 2.5
  star_4: 1.7
  star_3: 1.0
  star_2: 0.4
  star_1: 0.2

# =============================================================================
# NEGATIVE SIGNALS
# =============================================================================
# Penalize content similar to disliked or dropped shows.
negative_signals:
  enabled: true
  bad_ratings:
    enabled: true
    threshold: 3
    cap_penalty: 0.5
  dropped_shows:
    enabled: true
    min_episodes_watched: 2
    max_completion_percent: 25
    penalty_multiplier: -0.4
